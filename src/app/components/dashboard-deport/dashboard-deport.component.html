<mat-sidenav-container class="sidenav-container">
    <mat-sidenav #sidenav mode="side" opened class="sidebar">
      <mat-nav-list>
        <a mat-list-item href="#mis-datos">
          <mat-icon>account_circle</mat-icon>
          <span>Mis Datos</span>
        </a>
        <a mat-list-item href="#eventos-asignados">
          <mat-icon>event</mat-icon>
          <span>Eventos Asignados</span>
        </a>
      </mat-nav-list>
    </mat-sidenav>
  
    <mat-sidenav-content class="main-gradient">
      <mat-toolbar color="primary">
        <span>Dashboard Deport</span>
        <span class="spacer"></span>
  
        <button mat-icon-button [matMenuTriggerFor]="menu">
          <mat-icon>more_vert</mat-icon>
        </button>
        <mat-menu #menu="matMenu">
          <button mat-menu-item (click)="mostrarFotoPerfil()">
            <mat-icon>visibility</mat-icon>
            <span>Ver Foto</span>
          </button>
          <button mat-menu-item (click)="eliminarFotoPerfil()">
            <mat-icon>delete</mat-icon>
            <span>Eliminar Foto</span>
          </button>
        </mat-menu>
      </mat-toolbar>
  
      <div class="content">
        <div class="profile-picture">
          <img [src]="pers.fotoPerfilUrl" alt="Foto de perfil de {{pers.nombre}}" />
          <label class="edit-icon" for="upload-foto">
            <mat-icon>edit</mat-icon>
          </label>
          <input type="file" id="upload-foto" (change)="subirFotoPerfil($event)" />
        </div>
  
        <mat-card class="card-section" id="mis-datos">
          <h2>Mis Datos</h2>
          <p>{{ pers.apellidoYNombre }}</p>
          <p>{{ pers.documentoN }}</p>
          <p>{{ pers.funcion }}</p>
          <p>{{ pers.club }}</p>
          <p>{{ pers.categoria }}</p>
        </mat-card>
  
        <mat-card class="card-section" id="eventos-asignados">
          <h2>Eventos</h2>
          <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

            <!--- Note that these columns can be defined in any order.
                  The actual rendered columns are set as a property on the row definition" -->
          
            <!-- Position Column -->
            <ng-container matColumnDef="nombre">
              <th mat-header-cell *matHeaderCellDef> Nombre </th>
              <td mat-cell *matCellDef="let element"> {{element.nombre}} </td>
            </ng-container>
          
            <ng-container matColumnDef="fecha">
              <th mat-header-cell *matHeaderCellDef> Fecha </th>
              <td mat-cell *matCellDef="let element"> {{element.fecha | date:'dd/MM'}} </td>
            </ng-container>
            
            <ng-container matColumnDef="inscribirse">
              <th mat-header-cell *matHeaderCellDef> Accion </th>
              <td mat-cell *matCellDef="let element"> Inscribirse </td>
            </ng-container>
          
            <tr mat-header-row *matHeaderRowDef="displayedEventColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedEventColumns;"></tr>
          </table>
          
          
        </mat-card>
      </div>
    </mat-sidenav-content>
  </mat-sidenav-container>
