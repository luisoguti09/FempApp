<mat-sidenav-container class="sidenav-container">
  <mat-sidenav #sidenav mode="side" opened class="sidebar">
    <mat-nav-list>
      <a mat-list-item routerLink="mis-datos" routerLinkActive="active">
        <mat-icon>account_circle</mat-icon>
        <span>Mis Datos</span>  
      </a>
      <a mat-list-item routerLink="eventos-inscriptos" routerLinkActive="active">
  <mat-icon>event</mat-icon>
  <span>Mis Eventos</span>
</a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="main-gradient">
    <mat-toolbar color="primary">
      <span>Escritorio Deportista</span>
      <span class="spacer"></span>

      <button mat-icon-button [matMenuTriggerFor]="menu">
        <mat-icon>more_vert</mat-icon>
      </button>
      <mat-menu #menu="matMenu">
        <button mat-menu-item (click)="mostrarFotoPerfil()">
          <mat-icon>visibility</mat-icon>
          <span>Ver Foto</span>
        </button>
        <button mat-menu-item (click)="eliminarFotoPerfil()">
          <mat-icon>delete</mat-icon>
          <span>Eliminar Foto</span>
        </button>
      </mat-menu>
    </mat-toolbar>
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
